
[functions.send-order-notification]
enabled = true
verify_jwt = true
import_map = "./functions/send-order-notification/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-order-notification/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-order-notification/*.html" ]

[functions.manage-team]
verify_jwt = false

[functions.push-dispatch]
verify_jwt = false

[functions.auth-email]
# Supabase signs requests; the handler verifies the webhook signature.
verify_jwt = false

[functions.send-contact-message]
# Public website contact form; preserve the existing deployed gateway setting.
verify_jwt = false

[auth]
site_url = "https://sugarmamacookieco.com.au"
enable_signup = true
additional_redirect_urls = ["http://127.0.0.1:5173/admin/set-password", "http://localhost:5173/admin/set-password", "https://sugarmamacookieco.com.au/admin/set-password", "https://www.sugarmamacookieco.com.au/admin/set-password", "http://127.0.0.1:5173/auth/set-password", "http://localhost:5173/auth/set-password", "https://sugarmamacookieco.com.au/auth/set-password", "https://www.sugarmamacookieco.com.au/auth/set-password", "http://127.0.0.1:5173/account/callback", "http://127.0.0.1:5173/account/set-password", "http://localhost:5173/account/callback", "http://localhost:5173/account/set-password", "https://sugarmamacookieco.com.au/account/callback", "https://sugarmamacookieco.com.au/account/set-password", "https://www.sugarmamacookieco.com.au/account/callback", "https://www.sugarmamacookieco.com.au/account/set-password"]

[auth.email]
enable_confirmations = true
